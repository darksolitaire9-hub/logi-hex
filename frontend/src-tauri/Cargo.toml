[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.71"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc.13", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.0.0-rc.17", features = [] }
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-shell = "2.0.0-rc"
tokio = { version = "1", features = ["time"] }
anofox-forecast = "0.7.5"
reqwest = { version = "0.11", features = ["stream"] }
sha2 = "0.10"
futures-util = "0.3"
ort = { version = "2.0.0-rc.9", features = ["load-dynamic"] }
ndarray = "0.17.2"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "migrate"] }
# Type contract generation — TypeScript bindings auto-generated from Rust structs
ts-rs = "10"
# OS-native keyring for master encryption key (Windows Credential Manager)
keyring = { version = "3", features = ["windows-native"] }
# Field-level encryption: AES-256-GCM
aes-gcm = "0.10"
rand = "0.8"
# UUID generation on the Rust side (removes client-generated IDs)
uuid = { version = "1", features = ["v4"] }
# Memory hygiene: zero key material on drop
zeroize = { version = "1", features = ["derive"] }
# Encoding utilities for keyring and AES-GCM payload
hex = "0.4"
base64 = "0.21"
